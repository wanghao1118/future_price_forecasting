[unix_http_server]
file=/root/autodl-tmp/futures_price_forecasting-forward/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/futures_price_forecasting-forward/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/root/autodl-tmp/futures_price_forecasting-forward/supervisord.pid
childlogdir=/root/autodl-tmp/futures_price_forecasting-forward

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/futures_price_forecasting-forward/supervisor.sock

[program:futures-newsdesk-forward]
command=/root/miniconda3/bin/python -u /root/autodl-tmp/futures_price_forecasting-forward/public_proxy.py --bind 0.0.0.0 --port 6006 --upstream-port 18765 --backend-host 127.0.0.1:8765 --analysis-upstream-port 18778 --analysis-backend-host 127.0.0.1:4178
directory=/root/autodl-tmp/futures_price_forecasting-forward
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/root/autodl-tmp/futures_price_forecasting-forward/proxy.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/root/autodl-tmp/futures_price_forecasting-forward/proxy-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
stopasgroup=true
killasgroup=true
umask=0077
